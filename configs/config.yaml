# ---------------------------------------------------------------------------
# Central configuration. Every script reads this file; nothing is hard-coded.
# ---------------------------------------------------------------------------

seed: 42

paths:
  raw_dir: data/raw                 # the downloaded sms-call-internet-mi-*.txt files
  processed_dir: data/processed     # generated .npy artefacts
  results_dir: results
  figures_dir: results/figures
  tables_dir: results/tables
  predictions_dir: results/predictions

dataset:
  activity: internet                # column to forecast
  n_squares: 10000                  # Milan grid is 100 x 100
  intervals_per_day: 144            # 10-minute resolution
  timezone: Europe/Rome
  chunksize: 2000000                # rows per pandas chunk during ingest
  # Rows absent from the raw files mean "no records for that country in that
  # slot". For `internet` we treat an entirely absent (square, slot) pair as a
  # missing observation and interpolate it; see docs in src/data/loader.py.
  missing_policy: interpolate       # one of {interpolate, zero, nan}

# Chronological splits (local Europe/Rome time). No shuffling anywhere.
splits:
  train_start: "2013-11-01 00:00"
  train_end:   "2013-12-08 23:50"   # inclusive
  val_start:   "2013-12-09 00:00"
  val_end:     "2013-12-15 23:50"   # inclusive
  test_start:  "2013-12-16 00:00"
  test_end:    "2013-12-22 23:50"   # inclusive -> 1008 steps, Mon..Sun

eda:
  # Squares required by the brief in addition to the three busiest ones.
  extra_squares: [4159, 4556]
  first_two_weeks_start: "2013-11-01 00:00"
  first_two_weeks_end:   "2013-11-14 23:50"
  acf_max_lag: 1100                 # > 1008 so the weekly peak is visible

forecasting:
  horizon: 1                        # one-step-ahead
  sequence_length: 144              # default L; overridden by tuning
  use_time_features: true           # sin/cos time-of-day + day-of-week + weekend
  scaler:
    log1p: true                     # tame the right-skewed, bursty marginal
    method: standard                # standard | minmax

models:
  baselines:
    seasonal_period: 144

  sarimax:
    order: [1, 1, 1]                # (p, d, q) for the ARMA errors -- tuned: see experiment_log.csv
    fourier:                        # exogenous seasonality (avoids s=144 SARIMA)
      - {period: 144,  n_terms: 5}  # daily
      - {period: 1008, n_terms: 3}  # weekly
    log1p: true
    trend: c
    maxiter: 200

  lstm:
    sequence_length: 24             # tuned per architecture -- LSTM prefers a short window
    hidden_size: 128
    num_layers: 1
    dropout: 0.2
    lr: 0.003
    batch_size: 128
    max_epochs: 60
    patience: 8
    grad_clip: 1.0
    loss: huber

  tcn:
    sequence_length: 144            # tuned per architecture -- TCN prefers a full day
    channels: [32, 32, 32, 32]      # receptive field grows as 2^k
    kernel_size: 5
    dropout: 0.1
    lr: 0.003
    batch_size: 128
    max_epochs: 60
    patience: 8
    grad_clip: 1.0
    loss: huber

# Grids used by scripts/03_run_experiments.py --tune
tuning:
  lstm:
    sequence_length: [24, 144, 288]
    hidden_size: [32, 64, 128]
    num_layers: [1, 2]
    lr: [0.003, 0.001]
  tcn:
    sequence_length: [144, 288]
    kernel_size: [3, 5]
    dropout: [0.1, 0.2]
    lr: [0.003, 0.001]
  sarimax:
    order: [[1, 0, 0], [2, 0, 1], [3, 0, 2], [1, 1, 1]]

timing:
  n_repeats: 3                      # repeats for mean +- std of train/infer time
  warmup: 1                         # discarded warm-up repeats